# Configuração Nginx para DataStorm (Docker)
# Adicione este arquivo em: /etc/nginx/sites-available/datastorm.cloud
# Depois crie o symlink: ln -s /etc/nginx/sites-available/datastorm.cloud /etc/nginx/sites-enabled/
# Teste: nginx -t
# Recarregue: systemctl reload nginx

server {
    listen 80;
    server_name datastorm.cloud www.datastorm.cloud;

    # Redirecionar HTTP para HTTPS (após configurar SSL)
    # return 301 https://$server_name$request_uri;
    
    # Temporariamente, permitir HTTP até configurar SSL
    # Frontend Next.js (Docker)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend FastAPI (Docker)
    location /api/ {
        proxy_pass http://localhost:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

