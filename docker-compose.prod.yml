services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: datastorm-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
    networks:
      - datastorm-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datastorm-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - datastorm-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  datastorm-network:
    driver: bridge

